[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-bci"
version = "0.1.0"
description = "Reproducible EEG motor-imagery decoding baseline"
requires-python = ">=3.10"
dependencies = [
  "mne>=1.12,<2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

